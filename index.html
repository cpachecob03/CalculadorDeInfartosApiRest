<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC - Carlos Pacheco</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-lg p-8 border border-slate-200">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Calculadora de IMC y Riesgo</h1>
            <p class="text-sm text-slate-500 mt-1">API de IMC de Carlos Pacheco</p>
        </header>

        <form id="imcForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre:</label>
                <input type="text" id="nombre" required minlength="2" maxlength="50"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Introduce tu nombre">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Peso (kg):</label>
                    <input type="number" step="0.1" id="peso" required min="25.1" max="300"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Ej. 70">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Altura (cm):</label>
                    <input type="number" id="altura" required min="50.1" max="250"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Ej. 175">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Edad (años):</label>
                <input type="number" id="edad" required min="10" max="90"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Ej. 30">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Calcular IMC
            </button>
        </form>

        <div id="resultadoContainer" class="mt-8 hidden border-t border-slate-200 pt-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 text-center">Resultados para <span id="resSolicitante" class="text-blue-600"></span></h2>
            
            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm">
                <div class="flex justify-between">
                    <span class="font-medium text-slate-600">IMC Calculado:</span>
                    <span id="resImc" class="font-bold text-slate-900"></span>
                </div>
                <div class="flex justify-between">
                    <span class="font-medium text-slate-600">Categoría de Peso:</span>
                    <span id="resCategoria" class="font-semibold text-slate-900"></span>
                </div>
                <div class="flex justify-between">
                    <span class="font-medium text-slate-600">Probabilidad de Infarto:</span>
                    <span id="resProbabilidad" class="font-semibold text-slate-900"></span>
                </div>
                <div class="mt-2 pt-2 border-t border-slate-200">
                    <span class="block font-medium text-slate-600 mb-1">Recomendación:</span>
                    <p id="resRecomendacion" class="text-slate-800 italic bg-white p-2 rounded border border-slate-200"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('imcForm');
        const resultadoContainer = document.getElementById('resultadoContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                nombre: document.getElementById('nombre').value,
                peso_persona: parseFloat(document.getElementById('peso').value),
                altura_persona: parseFloat(document.getElementById('altura').value),
                edad: parseInt(document.getElementById('edad').value)
            };

            try {
                const response = await fetch('/api/calcular-imc', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                if (!response.ok) {
                    if (response.status === 422) {
                        const errorData = await response.json();
                        const mensajesError = errorData.detail.map(err => {
                            const campo = err.loc[err.loc.length - 1]; 
                            return `- ${campo}: ${err.msg}`;
                        }).join('\n');
                        
                        throw new Error(`Revisa los datos introducidos:\n${mensajesError}`);
                    } else {
                        throw new Error('Error al conectar con el servidor.');
                    }
                }

                const resultado = await response.json();

                document.getElementById('resSolicitante').textContent = resultado.solicitante;
                document.getElementById('resImc').textContent = resultado.calculo_imc.toFixed(2);
                document.getElementById('resCategoria').textContent = resultado.categoria_peso;
                document.getElementById('resProbabilidad').textContent = resultado.probabilidad_infarto;
                document.getElementById('resRecomendacion').textContent = resultado.recomendacion;

                resultadoContainer.classList.remove('hidden');

            } catch (error) {
                alert(error.message);
                console.error(error);
            }
        });
    </script>
</body>
</html>
